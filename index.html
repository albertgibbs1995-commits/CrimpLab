<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CrimpLab — Hangboard Trainer</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-light: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #f97316;
      --primary-hover: #ea580c;
      --success: #22c55e;
      --warning: #eab308;
      --danger: #ef4444;
      --wood: #d4a373;
      --wood-dark: #a98467;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      padding-bottom: 80px;
    }

    header {
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    header h1 span {
      color: var(--primary);
    }

    .board-badge {
      background: var(--surface);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary);
      border: 1px solid var(--surface-light);
    }

    main {
      padding: 16px;
      flex: 1;
    }

    .view {
      display: none;
      animation: fadeIn 0.2s ease-out;
    }

    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Board SVG Container */
    .board-stage {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--surface-light);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .board-svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    .hold-rect {
      transition: all 0.25s ease;
    }

    .hold-active {
      fill: var(--primary) !important;
      stroke: #fff !important;
      stroke-width: 2.5px !important;
      filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.8));
    }

    /* Cards & Controls */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--surface-light);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .tag {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--surface-light);
      color: var(--text);
    }

    .tag.warmup { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .tag.max { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .tag.repeaters { background: rgba(249, 115, 22, 0.2); color: var(--primary); }
    .tag.endurance { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }

    p.muted {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-secondary {
      background: var(--surface-light);
      color: var(--text);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-sm {
      padding: 8px 12px;
      font-size: 0.8rem;
      width: auto;
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--surface-light);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--primary);
      height: 6px;
    }

    .val-pill {
      min-width: 54px;
      text-align: center;
      background: var(--bg);
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* Active Timer Screen */
    .timer-display {
      text-align: center;
      padding: 24px 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      transition: background-color 0.3s;
    }

    .state-prep { background: rgba(234, 179, 8, 0.15); border: 2px solid var(--warning); }
    .state-hang { background: rgba(34, 197, 94, 0.2); border: 2px solid var(--success); }
    .state-rest { background: rgba(56, 189, 248, 0.15); border: 2px solid #38bdf8; }
    .state-done { background: rgba(249, 115, 22, 0.2); border: 2px solid var(--primary); }

    .timer-phase {
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .timer-clock {
      font-size: 4.5rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      margin: 8px 0;
    }

    .timer-instruction {
      font-size: 1rem;
      font-weight: 600;
    }

    .timer-meta {
      display: flex;
      justify-content: space-around;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .timer-meta strong {
      color: var(--text);
      display: block;
      font-size: 1rem;
    }

    /* Bottom Navigation */
    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--surface-light);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      z-index: 30;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 4px 16px;
    }

    .nav-btn.active {
      color: var(--primary);
    }

    .nav-icon {
      font-size: 1.25rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .hold-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: var(--bg);
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Crimp<span>Lab</span></h1>
      <div class="board-badge" id="active-board-label">Beastmaker 1000</div>
    </header>

    <main>
      <!-- VIEW 1: WORKOUTS -->
      <section id="view-workouts" class="view active">
        <div class="board-stage">
          <div id="workout-board-svg"></div>
          <p class="muted" style="text-align: center; margin-top: 8px; font-size: 0.75rem;">
            Tap any hold above to inspect depth & spacing
          </p>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h2 style="font-size: 1.05rem;">Generated Regimes</h2>
          <span class="muted" style="font-size: 0.75rem;">Tailored to board depths</span>
        </div>

        <div id="workout-list"></div>
      </section>

      <!-- VIEW 2: ACTIVE TIMER -->
      <section id="view-timer" class="view">
        <div class="board-stage">
          <div id="timer-board-svg"></div>
        </div>

        <div id="timer-box" class="timer-display state-prep">
          <div class="timer-phase" id="t-phase">GET READY</div>
          <div class="timer-clock" id="t-clock">00:05</div>
          <div class="timer-instruction" id="t-instruction">Prepare grip</div>
          <div class="timer-meta">
            <div>Set <strong id="t-set">1 / 6</strong></div>
            <div>Rep <strong id="t-rep">1 / 6</strong></div>
            <div>Grip <strong id="t-grip">2-Hand Half Crimp</strong></div>
          </div>
        </div>

        <div class="grid-2">
          <button class="btn btn-primary" id="btn-timer-toggle" onclick="toggleTimer()">Pause</button>
          <button class="btn btn-secondary" onclick="skipStep()">Skip Step</button>
        </div>
        <button class="btn btn-danger" style="margin-top: 10px;" onclick="exitWorkout()">End Workout</button>
      </section>

      <!-- VIEW 3: BOARDS & CUSTOM CREATOR -->
      <section id="view-boards" class="view">
        <h2 style="font-size: 1.05rem; margin-bottom: 12px;">Select Hangboard</h2>
        <div id="board-selector-list"></div>

        <hr style="border: 0; border-top: 1px solid var(--surface-light); margin: 20px 0;" />

        <h2 style="font-size: 1.05rem; margin-bottom: 12px;">Create Custom Board</h2>
        <div class="card">
          <div class="form-group">
            <label>Board Name</label>
            <input type="text" id="custom-name" placeholder="e.g., Home Woodie Board" />
          </div>

          <div class="board-stage" style="background: var(--bg); padding: 10px;">
            <div id="builder-preview-svg"></div>
          </div>

          <div class="form-group">
            <label>Row Position</label>
            <select id="hold-row">
              <option value="0">Top Row (Row 1)</option>
              <option value="1">Middle Row (Row 2)</option>
              <option value="2">Bottom Row (Row 3)</option>
            </select>
          </div>

          <div class="form-group">
            <label>Hold Layout</label>
            <select id="hold-layout">
              <option value="pair">Symmetric Pair (Left & Right)</option>
              <option value="center">Single Center Hold</option>
            </select>
          </div>

          <div class="form-group">
            <label>Hole Depth (Key for Workout Scaling)</label>
            <div class="slider-row">
              <input type="range" id="hold-depth" min="6" max="45" value="20" oninput="updateSliderLabels()" />
              <span class="val-pill" id="val-depth">20mm</span>
            </div>
          </div>

          <div class="form-group">
            <label>Hold Width (Fingers)</label>
            <div class="slider-row">
              <input type="range" id="hold-width" min="30" max="160" value="110" oninput="updateSliderLabels()" />
              <span class="val-pill" id="val-width">4-Fing</span>
            </div>
          </div>

          <div class="form-group" id="spacing-group">
            <label>Center-to-Center Spacing</label>
            <div class="slider-row">
              <input type="range" id="hold-spacing" min="140" max="440" value="300" oninput="updateSliderLabels()" />
              <span class="val-pill" id="val-spacing">30cm</span>
            </div>
          </div>

          <button class="btn btn-secondary" onclick="addCustomHold()">+ Add Hold to Board</button>

          <div id="custom-holds-list" style="margin-top: 14px;"></div>

          <button class="btn btn-primary" style="margin-top: 14px;" onclick="saveCustomBoard()">Save Custom Hangboard</button>
        </div>
      </section>
    </main>

    <nav id="bottom-nav">
      <button class="nav-btn active" onclick="switchView('workouts', this)">
        <span class="nav-icon">⏱️</span>
        <span>Workouts</span>
      </button>
      <button class="nav-btn" onclick="switchView('boards', this)">
        <span class="nav-icon">🪵</span>
        <span>Boards</span>
      </button>
    </nav>
  </div>

  <script>
    /* ==========================================================================
       1. PRESET HANGBOARD DATABASE (Real-world climbing dimensions)
       Canvas coordinate system: 500px wide x 180px high (1px ≈ 1mm scale)
       ========================================================================== */
    const PRESET_BOARDS = [
      {
        id: 'bm1000',
        name: 'Beastmaker 1000',
        brand: 'Beastmaker',
        material: 'wood',
        holds: [
          { id: 'jugs', label: 'Top Jugs', row: 0, layout: 'pair', depth: 40, width: 130, spacing: 360, fingers: 4 },
          { id: 'sloper35', label: '35° Slopers', row: 0, layout: 'pair', depth: 32, width: 110, spacing: 140, fingers: 4 },
          { id: 'deep4', label: 'Deep 4-Finger', row: 1, layout: 'pair', depth: 30, width: 105, spacing: 370, fingers: 4 },
          { id: 'mid4', label: 'Outer 4-Finger', row: 1, layout: 'pair', depth: 20, width: 105, spacing: 160, fingers: 4 },
          { id: 'center4', label: 'Center Deep', row: 1, layout: 'center', depth: 35, width: 95, spacing: 0, fingers: 4 },
          { id: 'small4', label: 'Bottom Edge', row: 2, layout: 'pair', depth: 15, width: 100, spacing: 360, fingers: 4 },
          { id: 'pocket3', label: '3-Finger Pocket', row: 2, layout: 'pair', depth: 22, width: 70, spacing: 180, fingers: 3 },
          { id: 'pocket2', label: '2-Finger Pocket', row: 2, layout: 'center', depth: 24, width: 55, spacing: 0, fingers: 2 }
        ]
      },
      {
        id: 'bm2000',
        name: 'Beastmaker 2000',
        brand: 'Beastmaker',
        material: 'wood',
        holds: [
          { id: 'sloper45', label: '45° Slopers', row: 0, layout: 'pair', depth: 28, width: 120, spacing: 360, fingers: 4 },
          { id: 'sloper30', label: '30° Slopers', row: 0, layout: 'pair', depth: 34, width: 110, spacing: 140, fingers: 4 },
          { id: 'mid4', label: 'Medium 4-Finger', row: 1, layout: 'pair', depth: 18, width: 100, spacing: 370, fingers: 4 },
          { id: 'incut3', label: '3-Finger Drag', row: 1, layout: 'pair', depth: 22, width: 72, spacing: 170, fingers: 3 },
          { id: 'centerjug', label: 'Center Warmup', row: 1, layout: 'center', depth: 32, width: 90, spacing: 0, fingers: 4 },
          { id: 'micro4', label: 'Small 4-Finger', row: 2, layout: 'pair', depth: 12, width: 95, spacing: 360, fingers: 4 },
          { id: 'back2', label: '2-Finger Pocket', row: 2, layout: 'pair', depth: 18, width: 52, spacing: 180, fingers: 2 },
          { id: 'mono', label: 'Center Mono', row: 2, layout: 'center', depth: 25, width: 32, spacing: 0, fingers: 1 }
        ]
      },
      {
        id: 'tension-grindstone',
        name: 'Tension Grindstone Mk2',
        brand: 'Tension Climbing',
        material: 'wood',
        holds: [
          { id: 'jug', label: 'Top Jugs', row: 0, layout: 'pair', depth: 38, width: 140, spacing: 340, fingers: 4 },
          { id: 'c25', label: '25mm Edge', row: 1, layout: 'pair', depth: 25, width: 115, spacing: 350, fingers: 4 },
          { id: 'c20', label: '20mm Edge', row: 1, layout: 'pair', depth: 20, width: 105, spacing: 140, fingers: 4 },
          { id: 'c15', label: '15mm Edge', row: 2, layout: 'pair', depth: 15, width: 115, spacing: 350, fingers: 4 },
          { id: 'c10', label: '10mm Micro Edge', row: 2, layout: 'pair', depth: 10, width: 105, spacing: 140, fingers: 4 },
          { id: 'center15', label: '1-Arm Center 15mm', row: 2, layout: 'center', depth: 15, width: 85, spacing: 0, fingers: 4 }
        ]
      },
      {
        id: 'lattice-triple',
        name: 'Lattice Triple Rung',
        brand: 'Lattice Training',
        material: 'wood',
        holds: [
          { id: 'r30', label: '30mm Warmup Rung', row: 0, layout: 'pair', depth: 30, width: 180, spacing: 260, fingers: 4 },
          { id: 'r20', label: '20mm Assessment Rung', row: 1, layout: 'pair', depth: 20, width: 180, spacing: 260, fingers: 4 },
          { id: 'r10', label: '10mm Max Rung', row: 2, layout: 'pair', depth: 10, width: 180, spacing: 260, fingers: 4 }
        ]
      }
    ];

    /* ==========================================================================
       2. STATE MANAGEMENT
       ========================================================================== */
    let customBoards = JSON.parse(localStorage.getItem('crimplab_custom_boards') || '[]');
    let activeBoardId = localStorage.getItem('crimplab_active_board') || 'bm1000';
    let builderHolds = [];

    function getAllBoards() {
      return [...PRESET_BOARDS, ...customBoards];
    }

    function getActiveBoard() {
      return getAllBoards().find(b => b.id === activeBoardId) || PRESET_BOARDS[0];
    }

    /* ==========================================================================
       3. PARAMETRIC SVG HANGBOARD RENDERER
       ========================================================================== */
    function renderBoardSVG(board, activeHoldIds = [], interactive = false) {
      const width = 500;
      const height = 185;
      const rowY = [24, 78, 132];
      const holdHeight = 32;

      let holdsMarkup = '';

      board.holds.forEach(h => {
        const isActive = activeHoldIds.includes(h.id);
        // Darker shade = deeper hold (visual depth cue)
        const shade = Math.max(15, 55 - h.depth);
        const fill = `hsl(24, 35%, ${shade}%)`;
        const activeClass = isActive ? 'hold-rect hold-active' : 'hold-rect';
        const clickAttr = interactive ? `onclick="alert('${h.label}: ${h.depth}mm deep (${h.fingers}-finger)')"` : '';

        if (h.layout === 'pair') {
          const leftX = (width / 2) - (h.spacing / 2) - (h.width / 2);
          const rightX = (width / 2) + (h.spacing / 2) - (h.width / 2);
          const y = rowY[h.row];

          holdsMarkup += `
            <rect x="${leftX}" y="${y}" width="${h.width}" height="${holdHeight}" rx="6"
              fill="${fill}" stroke="#5c4033" stroke-width="1.5" class="${activeClass}" ${clickAttr} />
            <text x="${leftX + h.width/2}" y="${y + 20}" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle" pointer-events="none">${h.depth}mm</text>

            <rect x="${rightX}" y="${y}" width="${h.width}" height="${holdHeight}" rx="6"
              fill="${fill}" stroke="#5c4033" stroke-width="1.5" class="${activeClass}" ${clickAttr} />
            <text x="${rightX + h.width/2}" y="${y + 20}" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle" pointer-events="none">${h.depth}mm</text>
          `;
        } else {
          const centerX = (width / 2) - (h.width / 2);
          const y = rowY[h.row];
          holdsMarkup += `
            <rect x="${centerX}" y="${y}" width="${h.width}" height="${holdHeight}" rx="6"
              fill="${fill}" stroke="#5c4033" stroke-width="1.5" class="${activeClass}" ${clickAttr} />
            <text x="${width/2}" y="${y + 20}" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle" pointer-events="none">${h.depth}mm</text>
          `;
        }
      });

      return `
        <svg viewBox="0 0 ${width} ${height}" class="board-svg">
          <defs>
            <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#d4a373"/>
              <stop offset="100%" stop-color="#b08256"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="${width-4}" height="${height-4}" rx="14" fill="url(#woodGrad)" stroke="#8c6239" stroke-width="3"/>
          ${holdsMarkup}
        </svg>
      `;
    }

    /* ==========================================================================
       4. DEPTH-DRIVEN WORKOUT ENGINE
       Maps board depths to established climbing training protocols
       ========================================================================== */
    function generateWorkoutsForBoard(board) {
      // Sort holds by depth descending (deepest/easiest first)
      const sorted = [...board.holds].sort((a, b) => b.depth - a.depth);
      const deepest = sorted[0];
      const shallowest = sorted[sorted.length - 1];

      // Find best matches for specific depth zones
      const warmupHold = sorted.find(h => h.depth >= 24 && h.layout === 'pair') || deepest;
      const workingEdge = sorted.find(h => h.depth >= 15 && h.depth <= 22 && h.fingers >= 3) || sorted[Math.floor(sorted.length / 2)];
      const maxEdge = sorted.find(h => h.depth <= 16 && h.fingers >= 3) || shallowest;
      const centerHold = sorted.find(h => h.layout === 'center') || workingEdge;
      const pocketHold = sorted.find(h => h.fingers <= 3) || workingEdge;

      return [
        {
          id: 'warmup',
          title: 'Progressive Finger Warmup',
          category: 'warmup',
          duration: '10 min',
          description: `Gradually recruits pulleys and tendons using ${warmupHold.label} (${warmupHold.depth}mm) down to ${workingEdge.label} (${workingEdge.depth}mm).`,
          blocks: [
            { hold: warmupHold, grip: '2-Hand Open Hand (Feet on floor if needed)', sets: 2, reps: 3, hangSec: 8, restSec: 12, setRestSec: 45 },
            { hold: workingEdge, grip: '2-Hand Half Crimp (70% Effort)', sets: 2, reps: 2, hangSec: 7, restSec: 15, setRestSec: 60 }
          ]
        },
        {
          id: 'max-hangs',
          title: 'Max Hangs (Eva López Protocol)',
          category: 'max',
          duration: '22 min',
          description: `High-intensity neuromuscular recruitment on ${maxEdge.label} (${maxEdge.depth}mm). Full 3-minute recovery between sets.`,
          blocks: [
            { hold: maxEdge, grip: '2-Hand Half Crimp (Max Load)', sets: 5, reps: 1, hangSec: 10, restSec: 0, setRestSec: 180 }
          ]
        },
        {
          id: 'repeaters',
          title: '7:3 Repeaters (Anderson Bros)',
          category: 'repeaters',
          duration: '24 min',
          description: `High-rep hypertrophy & strength-endurance. 7s hang / 3s rest × 6 reps across ${workingEdge.label} (${workingEdge.depth}mm) and ${pocketHold.label}.`,
          blocks: [
            { hold: workingEdge, grip: '2-Hand Half Crimp', sets: 3, reps: 6, hangSec: 7, restSec: 3, setRestSec: 150 },
            { hold: pocketHold, grip: `2-Hand ${pocketHold.fingers}-Finger Drag`, sets: 3, reps: 6, hangSec: 7, restSec: 3, setRestSec: 150 }
          ]
        },
        {
          id: 'unilateral',
          title: '1-Arm / Assisted Density',
          category: 'max',
          duration: '18 min',
          description: `Alternates Left and Right hands on ${centerHold.label} (${centerHold.depth}mm) to fix strength imbalances. Use pulley or band assist if needed.`,
          blocks: [
            { hold: centerHold, grip: 'LEFT Hand Only (Half Crimp)', sets: 3, reps: 2, hangSec: 6, restSec: 20, setRestSec: 90 },
            { hold: centerHold, grip: 'RIGHT Hand Only (Half Crimp)', sets: 3, reps: 2, hangSec: 6, restSec: 20, setRestSec: 90 }
          ]
        },
        {
          id: 'endurance',
          title: 'Long AeroCap Arcing',
          category: 'endurance',
          duration: '30 min',
          description: `Low-intensity continuous capillary training on ${warmupHold.label} (${warmupHold.depth}mm). Keep feet on a chair/box to stay under pump threshold.`,
          blocks: [
            { hold: warmupHold, grip: '2-Hand Open Drag (Foot-Assisted)', sets: 3, reps: 8, hangSec: 30, restSec: 15, setRestSec: 120 }
          ]
        }
      ];
    }

    /* ==========================================================================
       5. WORKOUT TIMER & WEB AUDIO BEEP ENGINE
       ========================================================================== */
    let audioCtx = null;
    let timerInterval = null;
    let isPaused = false;
    let workoutSteps = [];
    let currentStepIdx = 0;
    let secondsRemaining = 0;

    function playBeep(freq = 880, duration = 0.15, type = 'sine') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function startWorkout(workoutId) {
      const board = getActiveBoard();
      const workout = generateWorkoutsForBoard(board).find(w => w.id === workoutId);
      if (!workout) return;

      // Flatten blocks into a linear sequence of timer steps
      workoutSteps = [];
      workoutSteps.push({
        phase: 'PREP',
        duration: 5,
        hold: workout.blocks[0].hold,
        grip: workout.blocks[0].grip,
        instruction: `Chalk up! Next: ${workout.blocks[0].hold.label} (${workout.blocks[0].hold.depth}mm)`,
        setInfo: `1 / ${workout.blocks[0].sets}`,
        repInfo: `1 / ${workout.blocks[0].reps}`
      });

      workout.blocks.forEach((block, bIdx) => {
        for (let s = 1; s <= block.sets; s++) {
          for (let r = 1; r <= block.reps; r++) {
            workoutSteps.push({
              phase: 'HANG',
              duration: block.hangSec,
              hold: block.hold,
              grip: block.grip,
              instruction: `PULL ON: ${block.hold.label} (${block.hold.depth}mm)`,
              setInfo: `${s} / ${block.sets}`,
              repInfo: `${r} / ${block.reps}`
            });

            if (r < block.reps && block.restSec > 0) {
              workoutSteps.push({
                phase: 'REST',
                duration: block.restSec,
                hold: block.hold,
                grip: block.grip,
                instruction: 'Shake out — stay ready for next rep',
                setInfo: `${s} / ${block.sets}`,
                repInfo: `${r} / ${block.reps}`
              });
            }
          }

          if (s < block.sets || bIdx < workout.blocks.length - 1) {
            const nextHold = (s < block.sets) ? block.hold : workout.blocks[bIdx + 1].hold;
            workoutSteps.push({
              phase: 'REST',
              duration: block.setRestSec,
              hold: nextHold,
              grip: (s < block.sets) ? block.grip : workout.blocks[bIdx + 1].grip,
              instruction: `Set Rest — Next: ${nextHold.label} (${nextHold.depth}mm)`,
              setInfo: `${s} / ${block.sets}`,
              repInfo: 'Done'
            });
          }
        }
      });

      currentStepIdx = 0;
      isPaused = false;
      document.getElementById('btn-timer-toggle').innerText = 'Pause';
      document.getElementById('bottom-nav').style.display = 'none';
      switchView('timer');
      loadStep(0);

      clearInterval(timerInterval);
      timerInterval = setInterval(tickTimer, 1000);
    }

    function loadStep(idx) {
      if (idx >= workoutSteps.length) {
        finishWorkout();
        return;
      }
      const step = workoutSteps[idx];
      secondsRemaining = step.duration;

      const box = document.getElementById('timer-box');
      box.className = 'timer-display ' + (
        step.phase === 'PREP' ? 'state-prep' :
        step.phase === 'HANG' ? 'state-hang' : 'state-rest'
      );

      document.getElementById('t-phase').innerText = step.phase;
      document.getElementById('t-instruction').innerText = step.instruction;
      document.getElementById('t-set').innerText = step.setInfo;
      document.getElementById('t-rep').innerText = step.repInfo;
      document.getElementById('t-grip').innerText = step.grip;

      // Highlight the active hold on the SVG board
      const board = getActiveBoard();
      document.getElementById('timer-board-svg').innerHTML = renderBoardSVG(board, [step.hold.id], false);

      updateClockDisplay();
      if (step.phase === 'HANG') playBeep(1046, 0.25, 'triangle');
      else playBeep(523, 0.15, 'sine');
    }

    function tickTimer() {
      if (isPaused) return;
      secondsRemaining--;

      if (secondsRemaining <= 3 && secondsRemaining > 0) {
        playBeep(660, 0.1, 'sine');
      }

      if (secondsRemaining <= 0) {
        currentStepIdx++;
        loadStep(currentStepIdx);
      } else {
        updateClockDisplay();
      }
    }

    function updateClockDisplay() {
      const mins = Math.floor(secondsRemaining / 60).toString().padStart(2, '0');
      const secs = (secondsRemaining % 60).toString().padStart(2, '0');
      document.getElementById('t-clock').innerText = `${mins}:${secs}`;
    }

    function toggleTimer() {
      isPaused = !isPaused;
      document.getElementById('btn-timer-toggle').innerText = isPaused ? 'Resume' : 'Pause';
    }

    function skipStep() {
      currentStepIdx++;
      loadStep(currentStepIdx);
    }

    function finishWorkout() {
      clearInterval(timerInterval);
      playBeep(880, 0.4, 'triangle');
      const box = document.getElementById('timer-box');
      box.className = 'timer-display state-done';
      document.getElementById('t-phase').innerText = 'COMPLETE';
      document.getElementById('t-clock').innerText = 'DONE';
      document.getElementById('t-instruction').innerText = 'Great session! Log your added weight or rest up.';
    }

    function exitWorkout() {
      clearInterval(timerInterval);
      document.getElementById('bottom-nav').style.display = 'flex';
      switchView('workouts', document.querySelectorAll('.nav-btn')[0]);
    }

    /* ==========================================================================
       6. CUSTOM BOARD BUILDER LOGIC
       ========================================================================== */
    function updateSliderLabels() {
      const depth = document.getElementById('hold-depth').value;
      const width = parseInt(document.getElementById('hold-width').value, 10);
      const spacing = document.getElementById('hold-spacing').value;
      const layout = document.getElementById('hold-layout').value;

      document.getElementById('val-depth').innerText = `${depth}mm`;
      const fingers = width < 45 ? '1-Fing' : width < 65 ? '2-Fing' : width < 90 ? '3-Fing' : '4-Fing';
      document.getElementById('val-width').innerText = fingers;
      document.getElementById('val-spacing').innerText = `${Math.round(spacing / 10)}cm`;
      document.getElementById('spacing-group').style.display = layout === 'pair' ? 'block' : 'none';
    }

    document.getElementById('hold-layout').addEventListener('change', updateSliderLabels);

    function addCustomHold() {
      const row = parseInt(document.getElementById('hold-row').value, 10);
      const layout = document.getElementById('hold-layout').value;
      const depth = parseInt(document.getElementById('hold-depth').value, 10);
      const width = parseInt(document.getElementById('hold-width').value, 10);
      const spacing = parseInt(document.getElementById('hold-spacing').value, 10);
      const fingers = width < 45 ? 1 : width < 65 ? 2 : width < 90 ? 3 : 4;

      builderHolds.push({
        id: 'h_' + Date.now(),
        label: `Row ${row + 1} ${depth}mm ${fingers}F`,
        row,
        layout,
        depth,
        width,
        spacing,
        fingers
      });

      renderBuilderPreview();
    }

    function removeBuilderHold(idx) {
      builderHolds.splice(idx, 1);
      renderBuilderPreview();
    }

    function renderBuilderPreview() {
      const tempBoard = { holds: builderHolds };
      document.getElementById('builder-preview-svg').innerHTML = renderBoardSVG(tempBoard);

      const listEl = document.getElementById('custom-holds-list');
      listEl.innerHTML = builderHolds.map((h, i) => `
        <div class="hold-item-row">
          <span><strong>${h.label}</strong> (${h.layout === 'pair' ? 'Pair' : 'Center'})</span>
          <button class="btn btn-danger btn-sm" onclick="removeBuilderHold(${i})">Remove</button>
        </div>
      `).join('');
    }

    function saveCustomBoard() {
      const name = document.getElementById('custom-name').value.trim() || 'My Custom Board';
      if (builderHolds.length === 0) {
        alert('Add at least one hold to your board first.');
        return;
      }

      const newBoard = {
        id: 'custom_' + Date.now(),
        name,
        brand: 'Custom',
        material: 'wood',
        holds: [...builderHolds]
      };

      customBoards.push(newBoard);
      localStorage.setItem('crimplab_custom_boards', JSON.stringify(customBoards));
      activeBoardId = newBoard.id;
      localStorage.setItem('crimplab_active_board', activeBoardId);

      builderHolds = [];
      document.getElementById('custom-name').value = '';
      renderBuilderPreview();
      refreshApp();
      switchView('workouts', document.querySelectorAll('.nav-btn')[0]);
    }

    function selectBoard(id) {
      activeBoardId = id;
      localStorage.setItem('crimplab_active_board', id);
      refreshApp();
      switchView('workouts', document.querySelectorAll('.nav-btn')[0]);
    }

    function deleteCustomBoard(id, event) {
      event.stopPropagation();
      customBoards = customBoards.filter(b => b.id !== id);
      localStorage.setItem('crimplab_custom_boards', JSON.stringify(customBoards));
      if (activeBoardId === id) activeBoardId = 'bm1000';
      refreshApp();
    }

    /* ==========================================================================
       7. UI NAVIGATION & INITIALIZATION
       ========================================================================== */
    function switchView(viewName, btnEl) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(`view-${viewName}`).classList.add('active');
      if (btnEl) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
      }
    }

    function refreshApp() {
      const board = getActiveBoard();
      document.getElementById('active-board-label').innerText = board.name;
      document.getElementById('workout-board-svg').innerHTML = renderBoardSVG(board, [], true);

      // Render generated workouts
      const workouts = generateWorkoutsForBoard(board);
      document.getElementById('workout-list').innerHTML = workouts.map(w => `
        <div class="card">
          <div class="card-header">
            <span class="card-title">${w.title}</span>
            <span class="tag ${w.category}">${w.duration}</span>
          </div>
          <p class="muted" style="margin-bottom: 12px;">${w.description}</p>
          <button class="btn btn-primary" onclick="startWorkout('${w.id}')">Start Regime</button>
        </div>
      `).join('');

      // Render board selector list
      const allBoards = getAllBoards();
      document.getElementById('board-selector-list').innerHTML = allBoards.map(b => `
        <div class="card" style="cursor: pointer; border-color: ${b.id === board.id ? 'var(--primary)' : 'var(--surface-light)'};" onclick="selectBoard('${b.id}')">
          <div class="card-header">
            <span class="card-title">${b.name} ${b.id === board.id ? '✓' : ''}</span>
            <div>
              <span class="tag">${b.holds.length} Holds</span>
              ${b.brand === 'Custom' ? `<button class="btn btn-danger btn-sm" style="margin-left:6px;" onclick="deleteCustomBoard('${b.id}', event)">Del</button>` : ''}
            </div>
          </div>
          <p class="muted">Depths: ${[...new Set(b.holds.map(h => h.depth + 'mm'))].join(', ')}</p>
        </div>
      `).join('');
    }

    // Boot
    updateSliderLabels();
    renderBuilderPreview();
    refreshApp();
  </script>
</body>
